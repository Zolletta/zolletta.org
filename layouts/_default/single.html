{{ define "main" }}

<article class="post">

    <h1 class="post-title">{{ .Title }}</h1>
    {{ partial "digital-garden-box.html" . }}

  <div class="post-content">
    {{ .Content }}
  </div>

  {{ partial "content-tags.html" . }}
</article>
{{ end }}
