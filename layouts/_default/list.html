{{ define "title" }}{{ .Title }} - {{ .Site.Title }}{{ end }}

{{ define "main" }}
<div class="post" style="margin-bottom: 3rem;">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
        {{ if .Content }}
        <div class="post-content">
            {{ .Content }}
        </div>
        {{ end }}
    </header>
</div>

{{ partial "posts-grid.html" . }}
{{ end }}
